name: Sync GDrive to Koofr

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Config Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_CONTENT }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Sync Data
        id: sync_data
        run: |
          # Chạy sync và lưu kết quả tóm tắt vào file log
          rclone sync gdrive:/ koofr:/GoogleBackup --stats-one-line -v 2>&1 | tee rclone_log.txt

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_TO }}"
          TIME=$(date +'%d/%m/%Y %H:%M:%S')
          
          MSG="📊 *Báo cáo Backup:* %0A- Trạng thái: ${STATUS} %0A- Thời gian: ${TIME}"
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"

