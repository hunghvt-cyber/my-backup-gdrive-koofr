name: Sync GDrive and Koofr 2-Way

on:
  schedule:
    - cron: '0 19 * * *' # Chạy tự động mỗi ngày
  workflow_dispatch: # Chạy thủ công bằng tay

# Giải quyết vấn đề số 3: Không cho phép 2 workflow chạy đè lên nhau
concurrency:
  group: rclone-sync-group
  cancel-in-progress: false # Giữ nguyên workflow cũ đang chạy cho xong, không hủy giữa chừng

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Config Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_CONTENT }}" | base64 -d > ~/.config/rclone/rclone.conf

      # Giải quyết vấn đề số 1: Tạo sẵn thư mục cache để GitHub Action không bị lỗi "Path không tồn tại"
      - name: Pre-create Cache Dirs
        run: |
          mkdir -p ~/.cache/rclone
          mkdir -p ~/.config/rclone

      - name: Cache Rclone Bisync Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rclone
            ~/.config/rclone
          key: rclone-bisync-${{ github.run_id }}
          restore-keys: |
            rclone-bisync-

      - name: Bi-directional Sync (2 chiều)
        run: |
          # Kiểm tra nếu thư mục chứa file lịch sử bisync có dữ liệu bên trong
          if [ "$(ls -A $HOME/.cache/rclone/bisync 2>/dev/null)" ]; then
            echo "🔥 Tìm thấy lịch sử đồng bộ trước đó. Tiến hành Bisync thông thường..."
            rclone bisync gdrive:/ koofr:/GoogleBackup --verbose --conflict-resolve newer
          else
            echo "⚠️ Không tìm thấy lịch sử (hoặc chạy lần đầu). Tiến hành Resync cấu hình ban đầu..."
            # Giải quyết vấn đề số 2: Thêm --allow-non-empty để không bị lỗi nếu GDrive hoặc Koofr đã có sẵn file
            rclone bisync gdrive:/ koofr:/GoogleBackup --verbose --resync --allow-non-empty
          fi
