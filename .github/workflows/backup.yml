name: Sync GDrive and Koofr 2-Way

on:
  schedule:
    - cron: '0 19 * * *' # Chạy tự động lúc 2h sáng giờ VN
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Config Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_CONTENT }}" | base64 -d > ~/.config/rclone/rclone.conf

      # Bước này rất quan trọng: Giữ lại lịch sử bisync giữa các lần chạy GitHub Actions
      - name: Cache Rclone Bisync Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rclone
            ~/.config/rclone
          key: rclone-bisync-${{ github.run_id }}
          restore-keys: |
            rclone-bisync-

      - name: Bi-directional Sync (2 chiều)
        run: |
          # Kiểm tra xem đã từng chạy bisync trước đây chưa
          # Nếu chưa từng chạy, cần thêm flag --resync để khởi tạo lần đầu
          if [ -d "$HOME/.cache/rclone/bisync" ]; then
            echo "Tìm thấy dữ liệu cũ, tiến hành đồng bộ 2 chiều..."
            rclone bisync gdrive:/ koofr:/GoogleBackup --verbose --conflict-resolve newer
          else
            echo "Lần đầu tiên chạy, đang khởi tạo danh sách file (Resync)..."
            rclone bisync gdrive:/ koofr:/GoogleBackup --verbose --resync
          fi
