name: Two-Way Sync (Google Drive <-> Koofr)

on:
  schedule:
    # 02:00 giờ Việt Nam = 19:00 UTC
    - cron: '0 19 * * *'

  workflow_dispatch:
    inputs:
      resync:
        description: 'Force resync baseline. CHỈ bật khi lần đầu hoặc rclone yêu cầu resync.'
        required: false
        type: boolean
        default: false

# Không cho phép 2 lần bisync chạy đồng thời.
concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false

jobs:
  run-bisync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Install latest rclone
      # ============================================================
      - name: Install Rclone
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://rclone.org/install.sh | sudo bash

          echo "Rclone version:"
          rclone version


      # ============================================================
      # 2. Configure rclone
      # ============================================================
      - name: Configure Rclone
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_CONTENT" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "Available remotes:"
          rclone listremotes

          echo ""
          echo "Testing Google Drive..."
          rclone lsd gdrive: --max-depth 1

          echo ""
          echo "Testing Koofr..."
          rclone lsd koofr:GoogleBackup --max-depth 1


      # ============================================================
      # 3. Restore previous bisync state
      # ============================================================
      - name: Restore Bisync State
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rclone/bisync
          key: rclone-bisync-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            rclone-bisync-state-${{ github.ref_name }}-
            rclone-bisync-state-


      # ============================================================
      # 4. Check bisync state
      # ============================================================
      - name: Check Bisync State
        id: state
        shell: bash
        run: |
          set -euo pipefail

          STATE_DIR="$HOME/.cache/rclone/bisync"

          echo "Checking bisync state..."
          echo "Directory: $STATE_DIR"

          if [ -d "$STATE_DIR" ] && \
             find "$STATE_DIR" -type f -print -quit | grep -q .; then

            echo "state_exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "[INFO] Existing bisync state found:"
            find "$STATE_DIR" -type f -maxdepth 2 -print

          else

            echo "state_exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "[INFO] No usable bisync state found."

          fi


      # ============================================================
      # 5. Manual / Initial RESYNC
      #
      # Không tự động resync khi cache mất.
      # Đây là chủ ý để tránh một cache GitHub bị mất làm workflow
      # tự ý thiết lập lại baseline.
      # ============================================================
      - name: Resync
        if: inputs.resync == true
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "RCLONE BISYNC RESYNC"
          echo "============================================================"
          echo "Path 1 : gdrive:/"
          echo "Path 2 : koofr:/GoogleBackup"
          echo "Max delete : 100 objects"
          echo "============================================================"
          echo ""

          rclone bisync \
            gdrive:/ \
            koofr:/GoogleBackup \
            --resync \
            --fast-list \
            --drive-acknowledge-abuse \
            --track-renames \
            --max-delete 100 \
            --recover \
            --resilient \
            --stats 30s \
            --stats-one-line \
            --log-level INFO


      # ============================================================
      # 6. Normal two-way sync
      #
      # Chỉ chạy khi:
      # - Có bisync state
      # - Không yêu cầu resync thủ công
      # ============================================================
      - name: Normal Two-Way Sync
        if: inputs.resync != true && steps.state.outputs.state_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "RCLONE BISYNC - NORMAL RUN"
          echo "============================================================"
          echo "Path 1 : gdrive:/"
          echo "Path 2 : koofr:/GoogleBackup"
          echo "Max delete : 100 objects"
          echo "============================================================"
          echo ""

          rclone bisync \
            gdrive:/ \
            koofr:/GoogleBackup \
            --fast-list \
            --drive-acknowledge-abuse \
            --track-renames \
            --max-delete 100 \
            --recover \
            --resilient \
            --stats 30s \
            --stats-one-line \
            --log-level INFO


      # ============================================================
      # 7. Stop safely if state is missing
      #
      # Không tự ý resync.
      # ============================================================
      - name: Stop - Bisync State Missing
        if: inputs.resync != true && steps.state.outputs.state_exists != 'true'
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "ERROR: BISYNC STATE NOT FOUND"
          echo "============================================================"
          echo ""
          echo "Không tìm thấy bisync state."
          echo ""
          echo "Không tự động chạy --resync để tránh thay đổi dữ liệu"
          echo "ngoài ý muốn."
          echo ""
          echo "Nếu đây là lần đầu hoặc cần tạo lại baseline:"
          echo "GitHub Actions -> Run workflow -> resync = true"
          echo ""
          exit 1


      # ============================================================
      # 8. Save bisync state
      #
      # Cache key dùng run_id để tránh conflict với cache cũ.
      # Restore-keys ở bước 3 sẽ lấy state mới nhất.
      # ============================================================
      - name: Save Bisync State
        if: always() && hashFiles('/home/runner/.cache/rclone/bisync/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rclone/bisync
          key: rclone-bisync-state-${{ github.ref_name }}-${{ github.run_id }}


      # ============================================================
      # 9. Summary
      # ============================================================
      - name: Sync Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "SYNC JOB FINISHED"
          echo "============================================================"
          echo "Google Drive <-> Koofr"
          echo "Koofr target: koofr:/GoogleBackup"
          echo "============================================================"